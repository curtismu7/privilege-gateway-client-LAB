# PUBLIC ingress for the owner-run Real instance. The Host header is passed through unchanged: the lab allows the SE host through
# LAB_ALLOWED_HOSTS (deployment.yaml), so Host and the browser's Origin match for the same-origin write check. Real calls need a PingOne
# sign-in in the app (PGC_HOSTED=1); the ingress adds rate limits. 32k body: an agent message carries up to 16 kB of chat history.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privilege-gateway-client
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "32k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: __INGRESS_CLASS__
  tls:
    - hosts: [__SE_HOST__]
      secretName: privilege-gateway-client-tls
  rules:
    - host: __SE_HOST__
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: privilege-gateway-client, port: { name: http } } } }
