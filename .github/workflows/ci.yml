name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 26 only (owner decision 2026-10-31).
        node: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # The vendored shared stylesheet must equal the canonical copy and the hash pinned when it was last re-vendored.
      - run: bash scripts/check-ui-standard.sh
      # Rule 24b: tokens are decoded through the shared JsonPane only, never hand-rolled.
      - run: node scripts/check-token-decode.mjs
        env:
          CHECK_TOKEN_DECODE_ENFORCE: "1"
      - run: npm test
      - run: npm run build
      - run: PORT=7833 npm run doctor
      - run: npm run content-pack
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --redact -v
  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history and tree (counts only, the list is never printed)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          list="$RUNNER_TEMP/forbidden-strings.txt"
          printf '%s\n' "$FORBIDDEN_STRINGS" | grep -v '^$' > "$list" || true
          test -s "$list" || { echo "::error::FORBIDDEN_STRINGS secret is not set"; exit 1; }
          hist=$(git log -p --all | grep -cF -f "$list" || true)
          tree=$(git grep -l -F -f "$list" -- . || true)
          tree_count=$(printf '%s' "$tree" | grep -c . || true)
          echo "history hits: $hist"
          echo "tree files with hits: $tree_count"
          test "$hist" = "0" && test "$tree_count" = "0"
      - name: No AI attribution in the tree or any commit (owner rule 2026-11-07)
        if: ${{ !cancelled() }}
        run: bash scripts/check-no-ai-attribution.sh
